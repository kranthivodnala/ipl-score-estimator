# ── service-account.yml ────────────────────────────────────────────────────
# Kubernetes Service Account linked to IAM role via IRSA
# DevOps bridge: this is the Kubernetes equivalent of an ECS Task Role
# The annotation links this SA to the IAM role Terraform created
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ipl-service-account
  namespace: ipl-score-predictor
  annotations:
    # This annotation is what links the K8s SA to the AWS IAM role
    # Replace with actual ARN from terraform output: irsa_role_arn
    eks.amazonaws.com/role-arn: "arn:aws:iam::893918474791:role/ipl-score-predictor-irsa-role"
