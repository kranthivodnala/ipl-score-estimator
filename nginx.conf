# nginx.conf — serves frontend and proxies API calls to model containers
# DevOps bridge: this is your ALB listener rules, but local

server {
    listen 80;
    server_name localhost;

    # ── Serve frontend ─────────────────────────────────────────────────
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy Model A API calls ────────────────────────────────────────
    location /api/model-a/ {
        proxy_pass         http://model-a:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # ── Proxy Model B API calls ────────────────────────────────────────
    location /api/model-b/ {
        proxy_pass         http://model-b:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}